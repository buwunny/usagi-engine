# The workspace: one repository, several small crates.
# `cargo build` / `cargo test` at this level act on every member.
[workspace]
resolver = "3"
members = [
    "crates/mochitsuki-core",
    "crates/mochitsuki-engine",
    "crates/mochitsuki-mjai",
    # Added in later milestones:
    # "crates/mochitsuki-log",    # M4 + M6
    # "crates/mochitsuki-obs",    # M7
    # "crates/mochitsuki-py",     # M8
]

# Settings every crate inherits with `version.workspace = true` etc.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/buwunny/mochitsuki"
rust-version = "1.85"

[workspace.dependencies]
mochitsuki-core = { path = "crates/mochitsuki-core" }
mochitsuki-engine = { path = "crates/mochitsuki-engine" }
proptest = "1"

# Tests run with optimizations so the brute-force checks in M2 finish quickly.
[profile.test]
opt-level = 2

[profile.release]
debug = 1 # keep symbols so flamegraphs are readable (M9)
