[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "usagi-engine"
description = "Fast Tenhou-rules Riichi Mahjong engine (Rust) for Python"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.21"]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest"]
